services:
  - type: web
    name: alzheimers-detection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: MODEL_WEIGHTS_PATH
        value: "app/weights/best_resnet.pth"
    healthCheckPath: /health
