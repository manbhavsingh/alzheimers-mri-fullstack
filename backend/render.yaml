services:
  - type: web
    name: alzheimers-detection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://alzheimers-mri-fullstack.vercel.app"
      - key: MODEL_WEIGHTS_PATH
        value: "app/weights/best_resnet.pth"
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health
