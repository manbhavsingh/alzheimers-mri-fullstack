name: Neurio live API smoke test

on:
  push:
    branches:
      - feature/ai-report

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload repository sample MRI to deployed prediction endpoint
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://alzheimers-mri-fullstack-1.onrender.com"
          sample_url="https://raw.githubusercontent.com/manbhavsingh/Explainable-Alzheimers-Detection/main/class_0_example_4.png"

          echo "Checking backend health..."
          curl --fail --silent --show-error --max-time 30 "$base_url/health"

          echo "Downloading public repository test image..."
          curl --fail --location --silent --show-error --max-time 30 "$sample_url" --output /tmp/sample-mri.png
          file /tmp/sample-mri.png

          echo "Calling POST /predict..."
          predict_status=$(curl --silent --show-error --max-time 120 \
            --output /tmp/predict.json \
            --write-out '%{http_code}' \
            --request POST "$base_url/predict" \
            --form 'file=@/tmp/sample-mri.png;type=image/png')
          if [[ "$predict_status" != "200" ]]; then
            echo "POST /predict failed with HTTP $predict_status:"
            cat /tmp/predict.json
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/predict.json").read_text())
          required = ["predicted_class", "probabilities", "gradcam_note"]
          missing = [key for key in required if key not in result]
          if missing:
              raise SystemExit(f"Prediction response is missing keys: {missing}")
          print("Prediction endpoint passed.")
          print("Predicted class:", result["predicted_class"])
          print("Probability classes:", ", ".join(result["probabilities"].keys()))
          print("Grad-CAM note:", result["gradcam_note"])
          Path("/tmp/report-request.json").write_text(json.dumps({
              "label": result["predicted_class"],
              "probs": result["probabilities"],
              "gradcam_note": result["gradcam_note"],
          }))
          PY

          echo "Calling POST /report (this makes one Gemini API request)..."
          report_status=$(curl --silent --show-error --max-time 30 \
            --output /tmp/report.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --request POST "$base_url/report" \
            --data-binary @/tmp/report-request.json)
          if [[ "$report_status" != "200" ]]; then
            echo "POST /report failed with HTTP $report_status:"
            cat /tmp/report.json
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/report.json").read_text())
          required = ["summary", "confidence_note", "caveats", "next_steps"]
          missing = [key for key in required if key not in report]
          if missing:
              raise SystemExit(f"Report response is missing keys: {missing}")
          if not all(isinstance(report[key], str) for key in required[:2]):
              raise SystemExit("summary and confidence_note must be strings")
          if not all(isinstance(report[key], list) for key in required[2:]):
              raise SystemExit("caveats and next_steps must be arrays")
          print("Report endpoint passed. Valid structured JSON received.")
          print("Summary:", report["summary"])
          print("Caveats:", len(report["caveats"]))
          print("Next steps:", len(report["next_steps"]))
          PY
